name: CI – Lint & Test

on:
  push:
    branches: [main, develop, "claude/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Code Quality & Typing ────────────────────────────────────────────────
  lint:
    name: Lint & Type Check (Mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies & lint tools
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt
          pip install mypy types-PyYAML

      - name: Mypy (strict type checking)
        run: |
          python -m mypy --config-file pyproject.toml parser.py policy_engine.py policy_loader.py task_manager.py feasibility_filter.py ppo/ppo_agent.py execution/terrain_generator.py execution/persistent_memory.py execution/sandbox_executor.py execution/llm_drl_bridge.py environment/masking_sensor.py environment/reward_shaper.py environment/action_mapper.py

  # ── Unit & Integration Tests ───────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Run test suite
        run: |
          pytest tests/ -v --tb=short
        env:
          PYTHONPATH: .
          PYTHONDONTWRITEBYTECODE: 1
