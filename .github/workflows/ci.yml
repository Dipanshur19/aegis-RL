name: CI – Lint & Test

on:
  push:
    branches: [main, develop, "claude/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Linting ────────────────────────────────────────────────────────────
  lint:
    name: Lint (Ruff + Black + Mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: pip install ruff black mypy

      - name: Ruff (fast linter)
        run: ruff check . --output-format=github

      - name: Black (format check)
        run: black --check --diff .

      - name: Mypy (type checking)
        run: mypy --ignore-missing-imports --no-strict-optional .
        continue-on-error: true  # advisory until all stubs are in place

  # ── Unit & Integration Tests ───────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short --cov=. --cov-report=term-missing --cov-report=xml
        env:
          PYTHONDONTWRITEBYTECODE: 1

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
